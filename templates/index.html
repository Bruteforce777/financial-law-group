<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanilla-tel-input@1.3.0/dist/css/vanilla-tel-input.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vanilla-tel-input@1.3.0/dist/js/vanilla-tel-input.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Financial Law Group | Sign Up</title>
</head>
<body>
    <header class="hero">
        <div class="overlay">
            <h1>Financial Law Group</h1>
            <p>Helping you to recovery your lost investments with legal expertise you can trust.</p>
        </div>
    </header>

    <section class="forms-section">
        <div class="form-container">
            <form method="POST" action="/signup" class="form-box">
                <h2>CONTACT US</h2>
                <p>Join Us Today And Start Your Recovery Process.</p>
                <input type="text" name="name" placeholder="Name" required>
                <input type="text" name="surname" placeholder="Surname" required>
                <input type="email" name="email" placeholder="Email" required>      
                <input type="tel" id="signup-phone" name="phone" placeholder="Phone Number" required>
                <button type="submit">SIGN UP</button>
            </form>

            <form method="POST" action="/contact" class="form-box">
                <h2>HAVE A QUESTION..?</h2>
                <p>Send Us A Message.</p>
                <input type="text" name="name" placeholder="Name" required>
                <input type="text" name="surname" placeholder="Surname" required>
                <input type="email" name="email" placeholder="Email" required>      
                <input type="tel" id="contact-phone" name="phone" placeholder="Phone Number" required>     
                <textarea name="message" rows="10" placeholder="Your Message..." required></textarea>
                <button type="submit">SEND MESSAGE</button>
            </form>
        </div>
    </section>

    <footer>
        <p>@2015 Financial Law Group | All Rights Reserved</p>
    </footer>

</body>
</html>
